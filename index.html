<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store — Мини-магазин в Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .product-card { transition: all 0.2s; }
    .product-card:hover { transform: scale(1.03); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .cart-item { animation: slideIn 0.3s; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Улучшения для мобильных */
    @media (max-width: 400px) {
      .product-card .text-lg   { font-size: 1.05rem; line-height: 1.3; }
      .product-card .text-sm   { font-size: 0.8125rem; line-height: 1.3; }
      .product-card .text-2xl  { font-size: 1.4rem; }
      .product-card .h-48      { height: 9rem; }
      .product-card .p-4       { padding: 0.75rem; }
      .product-card button     { padding: 0.5rem 1rem; font-size: 0.875rem; }
      #products { gap: 0.75rem; }
    }
  </style>
</head>
<body class="bg-[#0F0F0F] text-white min-h-screen">
  <div class="max-w-md mx-auto px-2 sm:px-0">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 bg-[#1F1F1F] sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center text-2xl">🛍️</div>
        <div>
          <div class="font-bold text-xl">MyStore KZ</div>
          <div class="text-xs text-green-400">Доставка по Астане за 30 мин</div>
        </div>
      </div>
      <div onclick="toggleCart()" class="relative cursor-pointer">
        <div class="text-3xl">🛒</div>
        <div id="cart-count" 
             class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">
          0
        </div>
      </div>
    </div>

    <!-- Продукты -->
    <div class="p-4">
      <h1 class="text-2xl font-bold mb-6 text-center">Выбери товар и закажи!</h1>
      
      <div id="products" class="grid grid-cols-2 gap-4 sm:gap-5">
        <!-- Продукты добавятся через JS -->
      </div>
    </div>

    <!-- Корзина (модалка) -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end">
      <div class="bg-[#1F1F1F] w-full rounded-t-3xl max-h-[85vh] overflow-auto">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-[#1F1F1F]">
          <div class="text-2xl font-bold">Корзина</div>
          <div onclick="toggleCart()" class="text-4xl cursor-pointer">✕</div>
        </div>
        
        <div id="cart-items" class="p-4 space-y-4 min-h-[300px]">
          <!-- товары из корзины -->
        </div>

        <div class="p-4 border-t border-gray-700 sticky bottom-0 bg-[#1F1F1F]">
          <div class="flex justify-between text-lg mb-2">
            <span>Итого:</span>
            <span id="total-price" class="font-bold">0 ₸</span>
          </div>
          <button onclick="placeOrder()" 
                  class="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-5 rounded-2xl text-xl font-bold active:scale-95 transition">
            ✅ Оплатить через Kaspi (QR)
          </button>
          <div class="text-center text-xs text-gray-400 mt-3">
            После оплаты заказ придёт в этот чат
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1F1F1F");
    tg.setBackgroundColor("#0F0F0F");

    const products = [
      { id: 1, name: "Смарт-часы Pro", price: 89900, img: "⌚", desc: "Яркий экран • 7 дней без зарядки • влагозащита IP68" },
      { id: 2, name: "Беспроводные наушники", price: 34900, img: "🎧", desc: "Активное шумоподавление • 30 ч работы • быстрая зарядка" },
      { id: 3, name: "Умная колонка", price: 59900, img: "📢", desc: "Голосовой помощник Алиса • управление умным домом" },
      { id: 4, name: "Powerbank 20000mAh", price: 15900, img: "🔋", desc: "Быстрая зарядка 22.5W • 3 порта • LED-индикатор" }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = '';
      
      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card bg-[#1F1F1F] rounded-3xl overflow-hidden cursor-pointer';
        card.innerHTML = `
          <div class="h-48 sm:h-52 bg-gradient-to-br from-gray-800 to-black flex items-center justify-center text-7xl">
            ${product.img}
          </div>
          <div class="p-4 sm:p-5">
            <div class="font-bold text-lg sm:text-xl mb-1">${product.name}</div>
            <div class="text-sm sm:text-base text-gray-400 line-clamp-2 sm:line-clamp-3 mb-4">
              ${product.desc}
            </div>
            <div class="flex items-center justify-between">
              <div class="text-xl sm:text-2xl font-bold">${product.price.toLocaleString('ru-RU')} ₸</div>
              <button onclick="addToCart(${product.id}); event.stopPropagation()" 
                      class="bg-white text-black px-5 sm:px-7 py-2.5 sm:py-3 rounded-2xl font-bold text-sm sm:text-base active:bg-green-400">
                + В корзину
              </button>
            </div>
          </div>
        `;
        card.onclick = () => tg.showAlert(`📦 ${product.name}\nЦена: ${product.price.toLocaleString('ru-RU')} ₸\n\n${product.desc}`);
        container.appendChild(card);
      });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({...product, quantity: 1});
      }
      
      updateCartCount();
      tg.HapticFeedback?.notificationOccurred('success');
    }

    function updateCartCount() {
      let count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      document.getElementById('cart-count').textContent = count;
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
      if (!document.getElementById('cart-modal').classList.contains('hidden')) {
        renderCart();
      }
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400">Корзина пуста<br>Добавь товары сверху 👆</div>`;
        document.getElementById('total-price').textContent = '0 ₸';
        return;
      }

      let total = 0;
      
      cart.forEach((item, index) => {
        const qty = item.quantity || 1;
        const itemTotal = item.price * qty;
        total += itemTotal;
        
        const div = document.createElement('div');
        div.className = 'cart-item flex gap-4 bg-[#2A2A2A] rounded-2xl p-4';
        div.innerHTML = `
          <div class="text-5xl flex-shrink-0">${item.img}</div>
          <div class="flex-1">
            <div class="font-bold">${item.name}</div>
            <div class="text-sm text-gray-400">${item.desc}</div>
            <div class="flex items-center gap-3 mt-3">
              <button onclick="changeQuantity(${index}, -1)" class="w-8 h-8 bg-gray-700 rounded-xl">-</button>
              <span class="font-mono text-xl">${qty}</span>
              <button onclick="changeQuantity(${index}, 1)" class="w-8 h-8 bg-gray-700 rounded-xl">+</button>
            </div>
          </div>
          <div class="text-right">
            <div class="font-bold text-xl">${itemTotal.toLocaleString('ru-RU')} ₸</div>
            <button onclick="removeFromCart(${index})" class="text-red-400 text-xs mt-2">Удалить</button>
          </div>
        `;
        container.appendChild(div);
      });
      
      document.getElementById('total-price').textContent = `${total.toLocaleString('ru-RU')} ₸`;
    }

    function changeQuantity(index, delta) {
      cart[index].quantity = (cart[index].quantity || 1) + delta;
      if (cart[index].quantity < 1) cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function placeOrder() {
      if (cart.length === 0) {
        tg.showAlert('Корзина пуста!');
        return;
      }
      
      const total = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
      const orderId = Date.now();
      const orderDetails = cart.map(item => `${item.name} ×${item.quantity || 1}`).join('\n');
      
      tg.showPopup({
        title: 'Оплатить через Kaspi',
        message: `Сумма: ${total.toLocaleString('ru-RU')} ₸\n\nЗаказ #${orderId}\n\nТовары:\n${orderDetails}\n\nНажми "Показать QR" → отсканируй в Kaspi`,
        buttons: [
          {id: 'pay', type: 'default', text: 'Показать QR'},
          {type: 'cancel', text: 'Отмена'}
        ]
      }, (buttonId) => {
        if (buttonId === 'pay') {
          const qrData = `KASPI;${total};${tg.initDataUnsafe?.user?.username || 'test'};${orderId}`;
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrData)}`;
          
          tg.openLink(qrUrl);
          
          tg.showAlert(`Заказ #${orderId} создан! Оплати по QR → после оплаты напиши в чат, подтвержу вручную (тест).`);
          
          cart = [];
          updateCartCount();
          toggleCart();
        }
      });
    }

    // Запуск
    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
