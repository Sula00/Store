<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore KZ — Мини-магазин в Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .product-card { transition: all 0.2s; }
    .product-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px -4px rgba(0,0,0,0.2); }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      margin-top: auto;
      padding: 1.25rem 1.5rem 1.5rem;
    }

    .price {
      font-weight: bold;
      color: #4ade80;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .add-to-cart {
      padding: 0.625rem 1.25rem;
      font-size: 0.95rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Мобильные */
    @media (max-width: 640px) {
      #products { grid-template-columns: 1fr; gap: 1.25rem; }
      .product-card {
        display: flex;
        flex-direction: column;
        min-height: 420px;
      }
      .bottom-row {
        gap: 0.75rem;
        padding: 1rem 1rem 1.25rem;
      }
      .price { font-size: 1.4rem; }
      .add-to-cart { padding: 0.5rem 1rem; font-size: 0.9rem; }
    }

    /* Ноутбук и десктоп */
    @media (min-width: 641px) {
      #products { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; }
      .price { font-size: 1.75rem; }
      .add-to-cart { font-size: 1rem; padding: 0.75rem 1.5rem; }
    }
  </style>
</head>
<body class="bg-[#0F0F0F] text-white min-h-screen pb-10">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div class="flex items-center justify-between py-5 px-4 bg-[#1F1F1F] sticky top-0 z-50 rounded-b-2xl mb-8">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-purple-700 rounded-2xl flex items-center justify-center text-3xl">🛍️</div>
        <div>
          <div class="font-bold text-2xl">MyStore KZ</div>
          <div class="text-sm text-green-400">Доставка по Астане за 30 мин</div>
        </div>
      </div>
      <div onclick="toggleCart()" class="relative cursor-pointer">
        <div class="text-4xl">🛒</div>
        <div id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold border-2 border-gray-900">
          0
        </div>
      </div>
    </div>

    <!-- Продукты -->
    <div>
      <h1 class="text-3xl font-bold mb-8 text-center">Выбери товар и закажи!</h1>
      <div id="products" class="grid"></div>
    </div>

    <!-- Корзина модалка -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/85 z-50 flex items-end">
      <div class="bg-[#1A1A1A] w-full rounded-t-3xl max-h-[88vh] overflow-y-auto">
        <div class="p-6 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-[#1A1A1A] z-10">
          <div class="text-3xl font-bold">Корзина</div>
          <div onclick="toggleCart()" class="text-5xl cursor-pointer leading-none">×</div>
        </div>
        
        <div id="cart-items" class="p-6 space-y-6"></div>

        <div class="p-6 border-t border-gray-700 sticky bottom-0 bg-[#1A1A1A]">
          <div class="flex justify-between text-xl mb-4">
            <span>Итого:</span>
            <span id="total-price" class="font-bold">0 ₸</span>
          </div>
          <button onclick="placeOrder()" 
                  class="w-full bg-gradient-to-r from-emerald-600 to-green-600 py-5 rounded-2xl text-2xl font-bold active:scale-[0.98] transition">
            ✅ Оплатить через Kaspi (QR)
          </button>
          <div class="text-center text-sm text-gray-500 mt-4">
            После оплаты напиши в чат: "оплатил #XXXXXX"
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1F1F1F");
    tg.setBackgroundColor("#0F0F0F");

    const products = [
      { id: 1, name: "Смарт-часы Pro", price: 89900, img: "⌚", desc: "Яркий AMOLED экран • 7 дней автономности • IP68" },
      { id: 2, name: "Беспроводные наушники", price: 34900, img: "🎧", desc: "Активное шумоподавление • 30 ч работы • быстрая зарядка" },
      { id: 3, name: "Умная колонка Mini", price: 59900, img: "📢", desc: "Голосовой помощник • управление домом • 360° звук" },
      { id: 4, name: "Powerbank 20000mAh", price: 15900, img: "🔋", desc: "PD 22.5W • 3 порта • быстрая зарядка ноутбука" }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = '';

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card bg-[#1F1F1F] rounded-3xl overflow-hidden shadow-xl flex flex-col';
        card.innerHTML = `
          <div class="h-52 lg:h-60 bg-gradient-to-br from-gray-900 to-black flex items-center justify-center text-9xl lg:text-[10rem]">
            ${product.img}
          </div>
          <div class="flex flex-col flex-grow p-5 lg:p-6">
            <div class="font-bold text-xl lg:text-2xl mb-3">${product.name}</div>
            <div class="text-gray-400 text-base lg:text-lg line-clamp-3 mb-4 lg:mb-5 flex-grow">
              ${product.desc}
            </div>
            <div class="bottom-row">
              <div class="price text-2xl lg:text-3xl">
                ${product.price.toLocaleString('ru-RU')} ₸
              </div>
              <button onclick="addToCart(${product.id}); event.stopPropagation()" 
                      class="add-to-cart bg-white/95 text-black font-bold rounded-xl active:bg-green-200 transition shadow-md">
                + Корзина
              </button>
            </div>
          </div>
        `;
        card.onclick = (e) => {
          if (!e.target.closest('button')) {
            tg.showAlert(`📦 ${product.name}\n\nЦена: ${product.price.toLocaleString('ru-RU')} ₸\n${product.desc}`);
          }
        };
        container.appendChild(card);
      });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(item => item.id === id);
      if (existing) existing.quantity = (existing.quantity || 1) + 1;
      else cart.push({...product, quantity: 1});
      updateCartCount();
      tg.HapticFeedback?.notificationOccurred('success');
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      document.getElementById('cart-count').textContent = count;
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-gray-500 text-xl">Корзина пуста</div>`;
        document.getElementById('total-price').textContent = '0 ₸';
        return;
      }
      let total = 0;
      cart.forEach((item, i) => {
        const qty = item.quantity || 1;
        const sum = item.price * qty;
        total += sum;
        const div = document.createElement('div');
        div.className = 'flex gap-5 bg-[#252525] rounded-2xl p-5';
        div.innerHTML = `
          <div class="text-6xl flex-shrink-0">${item.img}</div>
          <div class="flex-1">
            <div class="font-bold text-xl mb-1">${item.name}</div>
            <div class="text-gray-400 text-sm mb-3">${item.desc}</div>
            <div class="flex items-center gap-4">
              <button onclick="changeQuantity(${i}, -1)" class="w-10 h-10 bg-gray-700 rounded-xl">-</button>
              <span class="text-2xl font-mono">${qty}</span>
              <button onclick="changeQuantity(${i}, 1)" class="w-10 h-10 bg-gray-700 rounded-xl">+</button>
            </div>
          </div>
          <div class="text-right min-w-[110px]">
            <div class="font-bold text-2xl">${sum.toLocaleString('ru-RU')} ₸</div>
            <button onclick="removeFromCart(${i})" class="text-red-400 text-sm mt-2">Удалить</button>
          </div>
        `;
        container.appendChild(div);
      });
      document.getElementById('total-price').textContent = total.toLocaleString('ru-RU') + ' ₸';
    }

    function changeQuantity(index, delta) {
      cart[index].quantity = Math.max(0, (cart[index].quantity || 1) + delta);
      if (cart[index].quantity === 0) cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    // ==================== КАСПИ QR (без AiPay) ====================
    function placeOrder() {
      if (cart.length === 0) {
        tg.showAlert('Корзина пуста!');
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
      const orderId = Date.now().toString().slice(-6);
      const orderItems = cart.map(item => `${item.name} ×${item.quantity || 1}`).join('\n');

      const qrData = `KASPI PAY\nСумма: ${total.toLocaleString('ru-RU')} ₸\nЗаказ: #${orderId}\nМагазин: MyStore KZ\nКлиент: ${tg.initDataUnsafe?.user?.username || 'аноним'}`;

      tg.showPopup({
        title: 'Оплатить заказ',
        message: `Сумма: ${total.toLocaleString('ru-RU')} ₸\n\nЗаказ #${orderId}\nТовары:\n${orderItems}\n\nСканируй QR в Kaspi`,
        buttons: [
          {id: 'show_qr', type: 'default', text: 'Показать QR'},
          {type: 'cancel', text: 'Отмена'}
        ]
      }, (buttonId) => {
        if (buttonId === 'show_qr') {
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(qrData)}&color=000000&bgcolor=FFFFFF`;

          tg.showPopup({
            title: 'Kaspi QR',
            message: 'Открой Kaspi → "Сканировать" → наведи на QR\nПосле оплаты напиши в чат: "оплатил #' + orderId + '"',
            buttons: [{type: 'ok'}]
          });

          tg.openLink(qrUrl);

          tg.showAlert(`✅ Заказ #${orderId} создан!\nСумма: ${total.toLocaleString('ru-RU')} ₸\n\nОплати по QR → после оплаты напиши мне "оплатил #${orderId}" — я подтвержу и отправлю товар.`);

          cart = [];
          updateCartCount();
          toggleCart();
        }
      });
    }

    // Запуск
    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
