<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store — Мини-магазин в Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .product-card { transition: all 0.2s; }
    .product-card:hover { transform: scale(1.03); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .cart-item { animation: slideIn 0.3s; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[#0F0F0F] text-white min-h-screen">
  <div class="max-w-md mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 bg-[#1F1F1F] sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center text-2xl">🛍️</div>
        <div>
          <div class="font-bold text-xl">MyStore KZ</div>
          <div class="text-xs text-green-400">Доставка по Астане за 30 мин</div>
        </div>
      </div>
      <div onclick="toggleCart()" class="relative cursor-pointer">
        <div class="text-3xl">🛒</div>
        <div id="cart-count" 
             class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">
          0
        </div>
      </div>
    </div>

    <!-- Продукты -->
    <div class="p-4">
      <h1 class="text-2xl font-bold mb-6 text-center">Выбери товар и закажи прямо в чате!</h1>
      
      <div id="products" class="grid grid-cols-2 gap-4">
        <!-- Продукты добавятся через JS -->
      </div>
    </div>

    <!-- Корзина (модалка) -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end">
      <div class="bg-[#1F1F1F] w-full rounded-t-3xl max-h-[85vh] overflow-auto">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-[#1F1F1F]">
          <div class="text-2xl font-bold">Корзина</div>
          <div onclick="toggleCart()" class="text-4xl cursor-pointer">✕</div>
        </div>
        
        <div id="cart-items" class="p-4 space-y-4 min-h-[300px]">
          <!-- товары из корзины -->
        </div>

        <div class="p-4 border-t border-gray-700 sticky bottom-0 bg-[#1F1F1F]">
          <div class="flex justify-between text-lg mb-2">
            <span>Итого:</span>
            <span id="total-price" class="font-bold">0 ₸</span>
          </div>
          <button onclick="placeOrder()" 
                  class="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-5 rounded-2xl text-xl font-bold active:scale-95 transition">
            ✅ Оплатить через Kaspi Pay (симуляция)
          </button>
          <div class="text-center text-xs text-gray-400 mt-3">
            После оплаты заказ прилетит тебе в этот чат
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === TELEGRAM WEBAPP ===
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1F1F1F");
    tg.setBackgroundColor("#0F0F0F");

    // === ПРОДУКТЫ (можно легко менять) ===
    const products = [
      { id: 1, name: "Смарт-часы Pro", price: 89900, img: "⌚", desc: "Яркий экран • 7 дней без зарядки" },
      { id: 2, name: "Беспроводные наушники", price: 34900, img: "🎧", desc: "Шумоподавление • 30 часов работы" },
      { id: 3, name: "Умная колонка", price: 59900, img: "📢", desc: "Алиса внутри • управляет светом" },
      { id: 4, name: "Портативный powerbank 20000mAh", price: 15900, img: "🔋", desc: "Заряжает 3 телефона сразу" }
    ];

    let cart = [];

    // Рендер продуктов
    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = '';
      
      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card bg-[#1F1F1F] rounded-3xl overflow-hidden cursor-pointer';
        card.innerHTML = `
          <div class="h-48 bg-gradient-to-br from-gray-800 to-black flex items-center justify-center text-7xl">
            ${product.img}
          </div>
          <div class="p-4">
            <div class="font-bold text-lg">${product.name}</div>
            <div class="text-sm text-gray-400 line-clamp-2">${product.desc}</div>
            <div class="flex justify-between items-center mt-4">
              <div class="text-2xl font-bold">${product.price.toLocaleString('ru-RU')} ₸</div>
              <button onclick="addToCart(${product.id}); event.stopImmediatePropagation()" 
                      class="bg-white text-black px-6 py-2 rounded-2xl font-bold text-sm active:bg-green-400">
                + В корзину
              </button>
            </div>
          </div>
        `;
        card.onclick = () => alert(`📦 ${product.name}\nЦена: ${product.price.toLocaleString('ru-RU')} ₸\n\nХочешь в корзину?`);
        container.appendChild(card);
      });
    }

    // Добавить в корзину
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({...product, quantity: 1});
      }
      
      updateCartCount();
      tg.HapticFeedback.notificationOccurred('success');
    }

    function updateCartCount() {
      let count = 0;
      cart.forEach(item => count += item.quantity || 1);
      document.getElementById('cart-count').textContent = count;
    }

    // Показать/скрыть корзину
    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('hidden');
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400">Корзина пуста<br>Добавь товары сверху 👆</div>`;
        document.getElementById('total-price').textContent = '0 ₸';
        return;
      }

      let total = 0;
      
      cart.forEach((item, index) => {
        const qty = item.quantity || 1;
        const itemTotal = item.price * qty;
        total += itemTotal;
        
        const div = document.createElement('div');
        div.className = 'cart-item flex gap-4 bg-[#2A2A2A] rounded-2xl p-4';
        div.innerHTML = `
          <div class="text-5xl flex-shrink-0">${item.img}</div>
          <div class="flex-1">
            <div class="font-bold">${item.name}</div>
            <div class="text-sm text-gray-400">${item.desc}</div>
            <div class="flex items-center gap-3 mt-3">
              <button onclick="changeQuantity(${index}, -1)" class="w-8 h-8 bg-gray-700 rounded-xl">-</button>
              <span class="font-mono text-xl">${qty}</span>
              <button onclick="changeQuantity(${index}, 1)" class="w-8 h-8 bg-gray-700 rounded-xl">+</button>
            </div>
          </div>
          <div class="text-right">
            <div class="font-bold text-xl">${itemTotal.toLocaleString('ru-RU')} ₸</div>
            <button onclick="removeFromCart(${index})" class="text-red-400 text-xs mt-2">Удалить</button>
          </div>
        `;
        container.appendChild(div);
      });
      
      document.getElementById('total-price').textContent = `${total.toLocaleString('ru-RU')} ₸`;
    }

    function changeQuantity(index, delta) {
      cart[index].quantity = (cart[index].quantity || 1) + delta;
      if (cart[index].quantity < 1) cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    // Оформить заказ
    function placeOrder() {
      if (cart.length === 0) return;
      
      const total = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
      
      tg.showPopup({
        title: '✅ Заказ оформлен!',
        message: `Сумма: ${total.toLocaleString('ru-RU')} ₸\n\nТовары приедут в Астану через 30 минут.\nНомер заказа: #TG-${Date.now()}`,
        buttons: [{id: 'ok', type: 'ok'}]
      });
      
      // Симуляция отправки в чат
      setTimeout(() => {
        tg.showAlert(`🎉 Заказ #TG-${Date.now()} отправлен!\n\nМенеджер свяжется с тобой в этом чате через 2 минуты.`);
        cart = [];
        updateCartCount();
        toggleCart();
      }, 800);
    }

    // === ЗАПУСК ===
    renderProducts();
    updateCartCount();

    // Показываем приветствие от Telegram
    tg.MainButton.setText('Открыть магазин');
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
      alert('Магазин уже открыт! 👍 Просто листай товары выше');
    });
  </script>
</body>
</html>
