<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store — Мини-магазин в Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .product-card { transition: all 0.2s; }
    .product-card:hover { transform: scale(1.02); box-shadow: 0 8px 12px -2px rgb(0 0 0 / 0.15); }
    .cart-item { animation: slideIn 0.3s; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Базовая сетка */
    #products {
      display: grid;
      gap: 1.25rem;
    }

    /* Мобильные (маленькие экраны) */
    @media (max-width: 640px) {
      #products { grid-template-columns: 1fr; }
      .product-card .h-48 { height: 10rem; }
      .product-card .p-4 { padding: 1rem; }
      .product-card .text-lg { font-size: 1.15rem; }
      .desc { font-size: 0.875rem; line-height: 1.35; }
      .price { font-size: 1.35rem; }
      .add-to-cart { padding: 0.5rem 1rem; font-size: 0.875rem; min-width: 110px; }
    }

    /* Планшеты и ноутбуки */
    @media (min-width: 641px) {
      #products { grid-template-columns: repeat(2, 1fr); }
      .bottom-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;          /* ← основной отступ между ценой и кнопкой */
        min-height: 48px;      /* фиксированная высота для выравнивания строк */
      }
      .price {
        font-size: 1.5rem;
        white-space: nowrap;
      }
      .add-to-cart {
        padding: 0.625rem 1.25rem;
        font-size: 0.95rem;
        flex-shrink: 0;
      }
    }

    /* Очень большие экраны (опционально) */
    @media (min-width: 1024px) {
      #products { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body class="bg-[#0F0F0F] text-white min-h-screen">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div class="flex items-center justify-between p-5 bg-[#1F1F1F] sticky top-0 z-50 rounded-b-xl mb-6">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center text-3xl">🛍️</div>
        <div>
          <div class="font-bold text-2xl">MyStore KZ</div>
          <div class="text-sm text-green-400">Доставка по Астане за 30 мин</div>
        </div>
      </div>
      <div onclick="toggleCart()" class="relative cursor-pointer">
        <div class="text-4xl">🛒</div>
        <div id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">
          0
        </div>
      </div>
    </div>

    <!-- Продукты -->
    <div class="pb-8">
      <h1 class="text-3xl font-bold mb-8 text-center">Выбери товар и закажи!</h1>
      
      <div id="products">
        <!-- карточки через JS -->
      </div>
    </div>

    <!-- Корзина модалка (без изменений) -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end">
      <div class="bg-[#1F1F1F] w-full rounded-t-3xl max-h-[90vh] overflow-auto">
        <div class="p-5 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-[#1F1F1F]">
          <div class="text-3xl font-bold">Корзина</div>
          <div onclick="toggleCart()" class="text-5xl cursor-pointer">✕</div>
        </div>
        
        <div id="cart-items" class="p-5 space-y-5 min-h-[300px]"></div>

        <div class="p-5 border-t border-gray-700 sticky bottom-0 bg-[#1F1F1F]">
          <div class="flex justify-between text-xl mb-4">
            <span>Итого:</span>
            <span id="total-price" class="font-bold">0 ₸</span>
          </div>
          <button onclick="placeOrder()" 
                  class="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-5 rounded-2xl text-2xl font-bold active:scale-95 transition">
            ✅ Оплатить через Kaspi (QR)
          </button>
          <div class="text-center text-sm text-gray-400 mt-4">
            После оплаты заказ придёт в этот чат
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1F1F1F");
    tg.setBackgroundColor("#0F0F0F");

    const products = [
      { id: 1, name: "Смарт-часы Pro", price: 89900, img: "⌚", desc: "Яркий экран • 7 дней без зарядки • влагозащита IP68" },
      { id: 2, name: "Беспроводные наушники", price: 34900, img: "🎧", desc: "Активное шумоподавление • 30 ч работы • быстрая зарядка" },
      { id: 3, name: "Умная колонка", price: 59900, img: "📢", desc: "Голосовой помощник Алиса • управление умным домом" },
      { id: 4, name: "Powerbank 20000mAh", price: 15900, img: "🔋", desc: "Быстрая зарядка 22.5W • 3 порта • LED-индикатор" }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = '';
      
      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card bg-[#1F1F1F] rounded-3xl overflow-hidden cursor-pointer shadow-lg';
        card.innerHTML = `
          <div class="h-48 lg:h-56 bg-gradient-to-br from-gray-800 to-black flex items-center justify-center text-8xl lg:text-9xl">
            ${product.img}
          </div>
          <div class="p-5 lg:p-6">
            <div class="font-bold text-xl lg:text-2xl mb-3">${product.name}</div>
            <div class="desc text-gray-300 mb-5 lg:mb-6 line-clamp-2 lg:line-clamp-3 text-base lg:text-lg">
              ${product.desc}
            </div>
            <div class="bottom-row">
              <div class="price font-bold text-green-400 text-2xl lg:text-3xl whitespace-nowrap">
                ${product.price.toLocaleString('ru-RU')} ₸
              </div>
              <button onclick="addToCart(${product.id}); event.stopPropagation()" 
                      class="add-to-cart bg-white text-black px-5 py-2.5 lg:px-6 lg:py-3 rounded-xl font-bold text-base lg:text-lg active:bg-green-300 transition">
                + Корзина
              </button>
            </div>
          </div>
        `;
        card.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') {
            tg.showAlert(`📦 ${product.name}\nЦена: ${product.price.toLocaleString('ru-RU')} ₸\n\n${product.desc}`);
          }
        };
        container.appendChild(card);
      });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({...product, quantity: 1});
      }
      
      updateCartCount();
      tg.HapticFeedback?.notificationOccurred('success');
    }

    function updateCartCount() {
      let count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      document.getElementById('cart-count').textContent = count;
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
      if (!document.getElementById('cart-modal').classList.contains('hidden')) {
        renderCart();
      }
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400">Корзина пуста</div>`;
        document.getElementById('total-price').textContent = '0 ₸';
        return;
      }

      let total = 0;
      
      cart.forEach((item, index) => {
        const qty = item.quantity || 1;
        const itemTotal = item.price * qty;
        total += itemTotal;
        
        const div = document.createElement('div');
        div.className = 'cart-item flex gap-5 bg-[#2A2A2A] rounded-2xl p-5';
        div.innerHTML = `
          <div class="text-6xl flex-shrink-0">${item.img}</div>
          <div class="flex-1">
            <div class="font-bold text-xl">${item.name}</div>
            <div class="text-gray-400 mt-1">${item.desc}</div>
            <div class="flex items-center gap-4 mt-4">
              <button onclick="changeQuantity(${index}, -1)" class="w-10 h-10 bg-gray-700 rounded-xl text-xl">-</button>
              <span class="font-mono text-2xl">${qty}</span>
              <button onclick="changeQuantity(${index}, 1)" class="w-10 h-10 bg-gray-700 rounded-xl text-xl">+</button>
            </div>
          </div>
          <div class="text-right">
            <div class="font-bold text-2xl">${itemTotal.toLocaleString('ru-RU')} ₸</div>
            <button onclick="removeFromCart(${index})" class="text-red-400 text-sm mt-3">Удалить</button>
          </div>
        `;
        container.appendChild(div);
      });
      
      document.getElementById('total-price').textContent = `${total.toLocaleString('ru-RU')} ₸`;
    }

    function changeQuantity(index, delta) {
      cart[index].quantity = (cart[index].quantity || 1) + delta;
      if (cart[index].quantity < 1) cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function placeOrder() {
      if (cart.length === 0) return tg.showAlert('Корзина пуста!');
      
      const total = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
      const orderId = Date.now();
      
      tg.showPopup({
        title: 'Оплатить через Kaspi',
        message: `Сумма: ${total.toLocaleString('ru-RU')} ₸\nЗаказ #${orderId}\n\nНажми "Показать QR"`,
        buttons: [
          {id: 'pay', type: 'default', text: 'Показать QR'},
          {type: 'cancel'}
        ]
      }, (buttonId) => {
        if (buttonId === 'pay') {
          const qrData = `KASPI;${total};${tg.initDataUnsafe?.user?.username || 'test'};${orderId}`;
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrData)}`;
          tg.openLink(qrUrl);
          tg.showAlert(`Заказ #${orderId} создан! Оплати по QR → напиши после оплаты (тест)`);
          cart = [];
          updateCartCount();
          toggleCart();
        }
      });
    }

    // Запуск
    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
